services:
  api:
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: sapling-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      otel-collector: {condition: service_started}
  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics.token:/etc/prometheus/metrics.token:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo]
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/collector/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo]
