groups:
  - name: sapling-api
    rules:
      - alert: SaplingHighHTTPErrorRate
        expr: sum(rate(sapling_http_request_duration_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(sapling_http_request_duration_seconds_count[5m])),0.001) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'API 5xx rate above 5% for 10m' }
