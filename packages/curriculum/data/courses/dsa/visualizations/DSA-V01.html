<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary search boundary</title><style>body{font:17px system-ui;max-width:760px;margin:32px auto;padding:0 16px;color:#172554;background:#f8fafc}main{border:1px solid #cbd5e1;border-radius:12px;background:white;padding:24px}h1{font-size:26px}label{display:block;margin-top:20px;font-weight:600}input{width:100%}output{float:right}pre{white-space:pre-wrap;background:#e0f2fe;padding:18px;border-radius:8px}button{padding:8px 14px}</style><main><h1>Binary search boundary</h1><p>Watch the half-open range shrink; duplicate values return the first possible index.</p><label for="target">Target <output id="targetout"></output></label><input type="range" id="target" min="0" max="20" step="1" value="7"><pre id="result" aria-live="polite"></pre><button id="reset">Reset</button></main><script>function update(){const target=Number(document.getElementById("target").value);document.getElementById("targetout").textContent=target;let a=[1,3,5,7,7,9,13,18],l=0,r=a.length,trace=[];while(l<r){let m=Math.floor((l+r)/2);trace.push(`lo=${l}, hi=${r}, mid=${m}, a[mid]=${a[m]}`);if(a[m]<target)l=m+1;else r=m;}document.getElementById('result').textContent=`Array: ${a.join(', ')}
${trace.join('\n')}
Insertion boundary: ${l}`;}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',update));document.getElementById('reset').addEventListener('click',()=>{document.getElementById("target").value=7;update()});update();</script></html>
