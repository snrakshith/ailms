<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed sliding window</title><style>body{font:17px system-ui;max-width:760px;margin:32px auto;padding:0 16px;color:#172554;background:#f8fafc}main{border:1px solid #cbd5e1;border-radius:12px;background:white;padding:24px}h1{font-size:26px}label{display:block;margin-top:20px;font-weight:600}input{width:100%}output{float:right}pre{white-space:pre-wrap;background:#e0f2fe;padding:18px;border-radius:8px}button{padding:8px 14px}</style><main><h1>Fixed sliding window</h1><p>Rolling sums update by subtracting an outgoing element and adding an incoming one.</p><label for="k">Window length <output id="kout"></output></label><input type="range" id="k" min="1" max="6" step="1" value="3"><pre id="result" aria-live="polite"></pre><button id="reset">Reset</button></main><script>function update(){const k=Number(document.getElementById("k").value);document.getElementById("kout").textContent=k;let a=[2,1,5,1,3,2],s=0,vals=[];for(let i=0;i<a.length;i++){s+=a[i];if(i>=k)s-=a[i-k];if(i>=k-1)vals.push(s);}document.getElementById('result').textContent=`Array: ${a.join(', ')}
Window sums: ${vals.join(', ')}
Maximum: ${Math.max(...vals)}`;}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',update));document.getElementById('reset').addEventListener('click',()=>{document.getElementById("k").value=3;update()});update();</script></html>
