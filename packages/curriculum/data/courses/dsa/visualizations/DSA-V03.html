<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Multi-source BFS on a line</title
  ><style>
    body {
      font: 17px system-ui;
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px;
      color: #172554;
      background: #f8fafc;
    }
    main {
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: white;
      padding: 24px;
    }
    h1 {
      font-size: 26px;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
    }
    input {
      width: 100%;
    }
    output {
      float: right;
    }
    pre {
      white-space: pre-wrap;
      background: #e0f2fe;
      padding: 18px;
      border-radius: 8px;
    }
    button {
      padding: 8px 14px;
    }
  </style>
  <main>
    <h1>Multi-source BFS on a line</h1>
    <p>The nearest of two sources determines shortest distance on this unweighted chain.</p>
    <label for="source">Source index <output id="sourceout"></output></label
    ><input type="range" id="source" min="0" max="8" step="1" value="2" />
    <pre id="result" aria-live="polite"></pre>
    <button id="reset">Reset</button>
  </main>
  <script>
    function update() {
      const source = Number(document.getElementById('source').value);
      document.getElementById('sourceout').textContent = source;
      let n = 9;
      let dist = Array.from({ length: n }, (_, i) =>
        Math.min(Math.abs(i - source), Math.abs(i - 8)),
      );
      document.getElementById('result').textContent = `Nodes:   0 1 2 3 4 5 6 7 8
Sources: ${source}, 8
Distance: ${dist.join(' ')}
Maximum distance: ${Math.max(...dist)}`;
    }
    document.querySelectorAll('input').forEach((e) => e.addEventListener('input', update));
    document.getElementById('reset').addEventListener('click', () => {
      document.getElementById('source').value = 2;
      update();
    });
    update();
  </script>
</html>
