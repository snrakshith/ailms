<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canary release decision</title><style>body{font:17px system-ui;max-width:760px;margin:32px auto;padding:0 16px;color:#172554;background:#f8fafc}main{border:1px solid #cbd5e1;border-radius:12px;background:white;padding:24px}h1{font-size:26px}label{display:block;margin-top:20px;font-weight:600}input{width:100%}output{float:right}pre{white-space:pre-wrap;background:#e0f2fe;padding:18px;border-radius:8px}button{padding:8px 14px}</style><main><h1>Canary release decision</h1><p>This example gate requires at least 1,000 requests and at most 1% errors; real gates compare baseline and confidence too.</p><label for="errors">Candidate errors <output id="errorsout"></output></label><input type="range" id="errors" min="0" max="100" step="1" value="10"><label for="requests">Candidate requests <output id="requestsout"></output></label><input type="range" id="requests" min="100" max="5000" step="100" value="1000"><pre id="result" aria-live="polite"></pre><button id="reset">Reset</button></main><script>function update(){const errors=Number(document.getElementById("errors").value);document.getElementById("errorsout").textContent=errors;const requests=Number(document.getElementById("requests").value);document.getElementById("requestsout").textContent=requests;let rate=errors/requests;document.getElementById('result').textContent=`Error rate ${(rate*100).toFixed(2)}%
${requests<1000?'HOLD: insufficient sample':rate>.01?'HOLD: rate above 1%':'METRIC PASS: still requires security and approval evidence'}`;}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',update));document.getElementById('reset').addEventListener('click',()=>{document.getElementById("errors").value=10;document.getElementById("requests").value=1000;update()});update();</script></html>
