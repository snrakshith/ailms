services:
  api:
    build: .
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
