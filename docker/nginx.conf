server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.cashfree.com https://accounts.google.com https://us.i.posthog.com https://cdn.mxpnl.com 'wasm-unsafe-eval'; worker-src 'self' blob:; frame-src 'self' https://sdk.cashfree.com https://accounts.google.com; style-src 'self' https://accounts.google.com; img-src 'self' data: https://accounts.google.com https://lh3.googleusercontent.com; font-src 'self'; connect-src 'self' https://us.i.posthog.com https://api-js.mixpanel.com https://api.mixpanel.com https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {proxy_pass http://api:4000;}
    location /robots.txt {try_files $uri =404;}
    location /sitemap.xml {try_files $uri =404;}
    location /llms.txt {try_files $uri =404;}
    location /llms-full.txt {try_files $uri =404;}
    location /assets/ {expires 1y; try_files $uri =404;}
    location / {expires -1; try_files $uri $uri/ /index.html;}
}
