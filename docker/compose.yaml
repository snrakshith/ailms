name: aiquest-learning
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 8
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 8
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: '4000'
      WEB_ORIGIN: http://localhost:8080
      MONGODB_URI: mongodb://mongo:27017/aiquest
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: 'false'
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: 'true'
      QUEUE_ENABLED: 'true'
      OTEL_ENABLED: 'false'
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      CONTENT_AUTHORS: ${CONTENT_AUTHORS:-}
      CONTENT_REVIEWERS: ${CONTENT_REVIEWERS:-}
      AIQUEST_LLM_KEY: ${AIQUEST_LLM_KEY:-}
      AIQUEST_LLM_MODEL: ${AIQUEST_LLM_MODEL:-}
      AIQUEST_LLM_COMPARE_MODELS: ${AIQUEST_LLM_COMPARE_MODELS:-}
      AIQUEST_LLM_BASE_URL: ${AIQUEST_LLM_BASE_URL:-https://api.openai.com/v1}
      CASHFREE_ENABLED: ${CASHFREE_ENABLED:-false}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      CASHFREE_CLIENT_ID: ${CASHFREE_CLIENT_ID:-}
      CASHFREE_CLIENT_SECRET: ${CASHFREE_CLIENT_SECRET:-}
      CASHFREE_WEBHOOK_URL: ${CASHFREE_WEBHOOK_URL:-}
      GENAI_PASS_PRICE_PAISE: ${GENAI_PASS_PRICE_PAISE:-49900}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SES_ENABLED: ${SES_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      INVOICE_SELLER_NAME: ${INVOICE_SELLER_NAME:-AI Quest}
      INVOICE_SELLER_ADDRESS: ${INVOICE_SELLER_ADDRESS:-}
      INVOICE_SELLER_GSTIN: ${INVOICE_SELLER_GSTIN:-}
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ['node', 'dist/workers/worker.js']
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/aiquest
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      COOKIE_SECURE: 'false'
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: 'true'
      SES_ENABLED: ${SES_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
    depends_on:
      redis: { condition: service_healthy }
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
        VITE_MIXPANEL_TOKEN: ${VITE_MIXPANEL_TOKEN:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_STATUS_PAGE_URL: ${VITE_STATUS_PAGE_URL:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
        SEO_REQUIRE_SITE_URL: ${SEO_REQUIRE_SITE_URL:-0}
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api: { condition: service_healthy }
volumes:
  mongo-data:
  redis-data:
