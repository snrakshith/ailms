name: DAST — OWASP ZAP disposable stack
on:
  push: {branches: [main]}
  pull_request: {}
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zap:
    name: ZAP web baseline + active OpenAPI (medium+ gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JWT_SECRET: 'ci-dast-only-not-production-secret-test-2026-long'
      METRICS_TOKEN: 'ci-dast-only-not-production-metrics-token-2026'
      CASHFREE_ENABLED: 'false'
      SES_ENABLED: 'false'
      AIQUEST_LLM_KEY: ''
      GOOGLE_CLIENT_ID: ''
      PUBLIC_SITE_URL: 'http://localhost:8080'
      SEO_REQUIRE_SITE_URL: '0'
      VITE_POSTHOG_KEY: ''
      VITE_MIXPANEL_TOKEN: ''
      VITE_SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Require reproducible dependency graph
        run: test -s pnpm-lock.yaml
      - name: Scan only the isolated CI stack
        run: bash scripts/security/run-zap.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: reports/zap/
          retention-days: 7
          if-no-files-found: ignore
