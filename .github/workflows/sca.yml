name: SCA — dependencies and vulnerabilities
on:
  push: { branches: [main] }
  pull_request: {}
  schedule:
    - cron: '30 3 * * 2'
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  audit:
    name: pnpm advisory audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { version: 10.20.0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: A resolved lockfile is mandatory
        run: test -s pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
  trivy:
    name: Trivy filesystem (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Require dependency lockfile
        run: test -s pnpm-lock.yaml
      - name: Trivy filesystem high/critical vulnerability gate
        run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.67.2
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /src
  dependency-review:
    name: New dependency review (high+)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    timeout-minutes: 15
    # Some repository plans/settings do not grant the dependency-graph comparison API to Actions.
    # The mandatory pnpm advisory audit above remains fail-closed for high/critical findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
