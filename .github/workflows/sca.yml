name: SCA — dependencies and vulnerabilities
on:
  push: { branches: [main] }
  pull_request: {}
  schedule:
    - cron: '30 3 * * 2'
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  audit:
    name: pnpm advisory audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { version: 10.20.0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: A resolved lockfile is mandatory
        run: test -s pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
  trivy:
    name: Trivy filesystem (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Require dependency lockfile
        run: test -s pnpm-lock.yaml
      - name: Trivy filesystem high/critical vulnerability gate
        run: >-
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/output" aquasec/trivy:0.67.2
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs packages/curriculum/data --skip-dirs node_modules
          --format json --output /output/trivy-filesystem.json /src
      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-filesystem-report
          path: ${{ runner.temp }}/trivy-filesystem.json
          if-no-files-found: warn
      - name: Summarize blocking Trivy findings
        if: always()
        env:
          TRIVY_REPORT: ${{ runner.temp }}/trivy-filesystem.json
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const report = JSON.parse(readFileSync(process.env.TRIVY_REPORT, 'utf8'));
          const blocking = (report.Results ?? []).flatMap((result) => [
            ...(result.Vulnerabilities ?? [])
              .filter((finding) => ['HIGH', 'CRITICAL'].includes(finding.Severity))
              .map((finding) => ({ target: result.Target, type: 'vulnerability', id: finding.VulnerabilityID, package: finding.PkgName, severity: finding.Severity, title: finding.Title })),
            ...(result.Misconfigurations ?? [])
              .filter((finding) => ['HIGH', 'CRITICAL'].includes(finding.Severity))
              .map((finding) => ({ target: result.Target, type: 'misconfiguration', id: finding.ID, severity: finding.Severity, title: finding.Title })),
            ...(result.Secrets ?? [])
              .filter((finding) => ['HIGH', 'CRITICAL'].includes(finding.Severity))
              .map((finding) => ({ target: result.Target, type: 'secret', id: finding.RuleID, severity: finding.Severity, title: finding.Title })),
          ]);
          console.log(JSON.stringify({ blocking }, null, 2));
          NODE
