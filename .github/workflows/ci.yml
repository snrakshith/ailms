name: Quality and Build
on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Format, lint, types, unit tests, coverage, build & SEO
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.20.0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: pnpm}
      - run: test -s pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:secrets && pnpm run test:marketing && pnpm run test:release && pnpm run test:core
      - run: pnpm run test:coverage
      - run: pnpm run build
        env: {PUBLIC_SITE_URL: 'https://example.org'}
      - run: pnpm run security:static
      - run: pnpm audit --audit-level=high
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: unit-coverage, path: coverage/, if-no-files-found: ignore}
  integration:
    name: Auth, learning and billing HTTP + Mongo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo: {image: 'mongo:8', ports: ['27017:27017']}
      redis: {image: 'redis:7-alpine', ports: ['6379:6379']}
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/aiquest_v14_integration
      JWT_SECRET: ci-integration-only-please-do-not-use-in-production
      METRICS_TOKEN: ci-integration-metrics-not-for-production-testing
      WEB_ORIGIN: http://localhost:5173
      CACHE_ENABLED: 'false'
      QUEUE_ENABLED: 'false'
      CASHFREE_ENABLED: 'false'
      SES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.20.0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: pnpm}
      - run: test -s pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wait-on tcp:127.0.0.1:27017 tcp:127.0.0.1:6379
      - run: pnpm run test:integration
  containers:
    name: Docker images
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - run: docker build -f docker/api.Dockerfile -t aiquest-api:test .
      - run: docker build --build-arg PUBLIC_SITE_URL=https://example.org -f docker/web.Dockerfile -t aiquest-web:test .
      - name: Trivy API container high/critical vulnerability gate
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: aiquest-api:test
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Trivy Web container high/critical vulnerability gate
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: aiquest-web:test
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
