name: Secrets — TruffleHog
on:
  pull_request: {}
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      # No floating @main action ref: run the same fail-closed scanner used by pre-push.
      # Ensure a verified and reviewed TruffleHog release is pinned before production.
      - name: Run TruffleHog history scan
        run: bash scripts/security/trufflehog-check.sh
