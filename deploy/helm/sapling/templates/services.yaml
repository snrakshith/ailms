apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: {{ .Release.Name }}-api}
  ports: [{name: http, port: 4000, targetPort: 4000}]
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: {{ .Release.Name }}-web}
  ports: [{name: http, port: 8080, targetPort: 8080}]
